apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  labels:
    app: todoapp
spec:
  containers:
    - name: todoapp
      image: whatmodeprog/todoapp:3.0.0
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
      readinessProbe:
        httpGet:
          
          port: 8080